<!doctype html>
<!-- The picture shown when hireexe.me is pasted into an email, Slack, LinkedIn, WhatsApp or iMessage.
     It is the game's own title screen, set out at 1200 x 630, the size link cards expect.
     tools/build-link-preview.js renders this page to assets/social/link-preview.jpg. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>HIRE.EXE link preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#141b45;font-family:"DejaVu Sans Mono","Courier New",monospace}
.window{position:absolute;inset:22px;border:4px solid #fff;box-shadow:0 0 0 2px #10143a,10px 10px 0 #0c1030;display:flex;flex-direction:column}
.titlebar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;background:linear-gradient(90deg,#1b2a8a,#2f52c6);color:#fff;border-bottom:3px solid #10143a}
.titlebar strong{font-size:27px;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.titlebar img{height:34px;image-rendering:pixelated}
.titlebar small{font-size:15px;letter-spacing:.14em;margin-left:16px;opacity:.9;font-weight:400}
.keys{display:flex;gap:6px}
.keys i{width:34px;height:34px;background:#d6d8e8;border:2px solid #10143a;box-shadow:inset 2px 2px #fff,inset -2px -2px #8a8ea8;color:#10143a;font:700 22px/28px "DejaVu Sans Mono",monospace;text-align:center;font-style:normal}
.scene{position:relative;flex:1;overflow:hidden;background:linear-gradient(90deg,#15142efa 0%,#191338d4 44%,#19133800 80%),url(../assets/production/backgrounds/application-alley.png) 50% 42%/cover}
.copy{position:absolute;left:58px;top:50%;transform:translateY(-52%);color:#fff}
h1{margin:0;font-size:172px;line-height:1;letter-spacing:-.08em;text-shadow:6px 7px #252049}
h1 span{color:#ffc956}
p{margin:22px 0 0 6px;font-size:33px;line-height:1.3;letter-spacing:-.01em;text-shadow:2px 2px #15142e}
.by{margin-top:26px;font-size:22px;color:#ffc956;letter-spacing:.06em}
.hero{position:absolute;right:54px;bottom:-6px;width:395px;height:474px;image-rendering:pixelated;filter:drop-shadow(6px 6px 0 #1a173b88);
  background:url(../assets/production/characters/hero-atlas.png) no-repeat;background-size:600% 300%;background-position:40% 0}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><strong><img src="../assets/production/enemies/icons/terminal.png" alt="">HIRE.EXE<small>A PLAYABLE APPLICATION</small></strong><div class="keys"><i>□</i><i>×</i></div></div>
  <div class="scene">
    <div class="copy">
      <h1>HIRE<span>.EXE</span></h1>
      <p>A job application,<br>disguised as a video game.</p>
      <p class="by">AUGUSTUS EDEM · HIREEXE.ME</p>
    </div>
    <div class="hero" role="img" aria-label="Augustus, running"></div>
  </div>
</div>
</body>
</html>
