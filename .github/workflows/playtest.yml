name: Playtest
on:
  push:
    branches: [feat/hired-exe-art-and-game-handoff]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, android, iphone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/simulation.test.js
      - run: python tools/build.py && python tests/build-check.py
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps ${{ matrix.profile == 'iphone' && 'webkit' || 'chromium' }}
      - run: python tests/browser.py ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-${{ matrix.profile }}
          path: evidence/
